<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Baroko – Život měšťanů</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: #160f0a;
      font-family: Georgia, "Times New Roman", serif;
    }

    [hidden] {
      display: none !important;
    }

    /* ==================================================
       HLAVNÍ SCÉNA
       ================================================== */

    .game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #21150d;
    }

    .scene-background {
      position: absolute;
      inset: 0;

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      transition: opacity 0.45s ease;
    }

    .scene-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;

      pointer-events: none;

      background:
        linear-gradient(
          180deg,
          rgba(23, 13, 6, 0.18),
          transparent 35%,
          transparent 70%,
          rgba(19, 10, 5, 0.27)
        );
    }

    /* ==================================================
       HORNÍ PANEL
       ================================================== */

    .top-panel {
      position: absolute;
      top: 18px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 50;

      min-width: 430px;

      padding: 10px 25px;

      border: 2px solid #b98943;
      border-radius: 15px;

      background: rgba(55, 32, 16, 0.9);

      color: #f6dda6;

      text-align: center;

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.35);
    }

    .scene-number {
      margin-bottom: 2px;

      color: #d0aa6a;

      font-size: 12px;
      font-weight: bold;

      letter-spacing: 3px;
    }

    .scene-title {
      font-size: 24px;
      letter-spacing: 2px;
    }

    /* ==================================================
       POSTAVA HRÁČE
       ================================================== */

    .player-character {
      position: absolute;

      left: 2%;
      bottom: 0;

      z-index: 18;

      height: 41vh;
      max-height: 430px;

      filter:
        drop-shadow(
          0 10px 15px rgba(0, 0, 0, 0.45)
        );

      pointer-events: none;
    }

    /* ==================================================
       MLUVÍCÍ BUBLINA
       ================================================== */

    .guide-message {
      position: absolute;

      left: 18%;
      bottom: 25%;

      z-index: 42;

      max-width: 395px;

      padding: 15px 19px;

      border: 2px solid #cda76f;
      border-radius: 19px;

      background: #fffdf8;

      color: #3d2618;

      font-size: 16px;
      line-height: 1.45;

      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.30);
    }

    .guide-message::after {
      content: "";

      position: absolute;

      left: -19px;
      bottom: 27px;

      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-right: 20px solid #fffdf8;
    }

    /* ==================================================
       HOTSPOTY
       ================================================== */

    .hotspots {
      position: absolute;
      inset: 0;
      z-index: 20;
    }

    .hotspot {
      position: absolute;

      width: 54px;
      height: 54px;

      display: flex;
      justify-content: center;
      align-items: center;

      border: 3px solid #ffe3a2;
      border-radius: 50%;

      background: rgba(184, 126, 43, 0.68);

      color: #fff6dc;

      font-size: 24px;

      cursor: pointer;

      box-shadow:
        0 0 11px rgba(255, 212, 115, 0.85),
        0 0 25px rgba(255, 182, 51, 0.55);

      animation:
        glow 1.35s ease-in-out infinite alternate;

      transition:
        transform 0.2s ease,
        opacity 0.25s ease;
    }

    @keyframes glow {

      from {
        box-shadow:
          0 0 8px rgba(255, 207, 102, 0.65),
          0 0 16px rgba(255, 190, 61, 0.4);
      }

      to {
        box-shadow:
          0 0 18px rgba(255, 225, 143, 1),
          0 0 34px rgba(255, 188, 54, 0.85);
      }

    }

    .hotspot:hover {
      transform:
        translate(-50%, -50%)
        scale(1.15) !important;
    }

    .hotspot.visited {
      opacity: 0.38;
      animation: none;

      box-shadow: none;
    }

    /* ==================================================
       INFORMAČNÍ BUBLINA
       ================================================== */

    .info-bubble {
      position: absolute;

      z-index: 46;

      width: min(380px, 35vw);

      padding: 15px 18px;

      border: 2px solid #d0a96f;
      border-radius: 18px;

      background: #ffffff;

      color: #362116;

      font-size: 15px;
      line-height: 1.45;

      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.30);

      opacity: 0;

      pointer-events: none;

      transform: translateY(6px);

      transition:
        opacity 0.22s ease,
        transform 0.22s ease;
    }

    .info-bubble.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ==================================================
       POSTUP
       ================================================== */

    .scene-progress {
      position: absolute;

      left: 24px;
      top: 24px;

      z-index: 50;

      padding: 9px 14px;

      border-radius: 11px;

      background:
        rgba(47, 28, 15, 0.87);

      border:
        1px solid rgba(211, 165, 90, 0.7);

      color: #efd49a;

      font-size: 14px;
    }

    /* ==================================================
       DÁLE
       ================================================== */

    .next-button {
      position: absolute;

      right: 35px;
      bottom: 32px;

      z-index: 60;

      padding: 12px 32px;

      border: 2px solid #f1d698;
      border-radius: 12px;

      background:
        linear-gradient(
          145deg,
          #c7933d,
          #81501d
        );

      color: #fff8e8;

      font-size: 19px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 7px 18px rgba(0, 0, 0, 0.35);

      transition:
        transform 0.2s ease,
        filter 0.2s ease;
    }

    .next-button:hover {
      transform: scale(1.07);
      filter: brightness(1.12);
    }

    /* ==================================================
       MINIÚKOL – MĚSTO
       ================================================== */

    .city-task {
      position: absolute;

      left: 50%;
      top: 55%;

      transform: translate(-50%, -50%);

      z-index: 70;

      width: min(760px, 82vw);

      padding: 25px;

      border: 4px solid #ae7d39;
      border-radius: 21px;

      background:
        linear-gradient(
          145deg,
          rgba(248, 236, 208, 0.97),
          rgba(217, 181, 122, 0.97)
        );

      color: #47291a;

      text-align: center;

      box-shadow:
        0 20px 48px rgba(0, 0, 0, 0.52);
    }

    .city-task h2 {
      margin-bottom: 6px;

      font-size: 28px;
    }

    .city-task p {
      margin-bottom: 18px;

      font-size: 15px;
    }

    .task-options {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 10px;
    }

    .task-option {
      padding: 13px;

      border: 2px solid #b68743;
      border-radius: 11px;

      background: #fff7e7;

      color: #47291a;

      font-size: 15px;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .task-option:hover {
      transform: scale(1.025);

      background: #ffebbf;
    }

    .task-option.correct {
      background: #dceabf;
      border-color: #7f9a4e;
    }

    .task-option.wrong {
      background: #edcbc1;
      border-color: #ad5848;
    }

    .task-feedback {
      min-height: 24px;

      margin-top: 14px;

      font-size: 16px;
      font-weight: bold;
    }

    /* ==================================================
       KONEC
       ================================================== */

    .finish-screen {
      position: absolute;
      inset: 0;

      z-index: 100;

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        rgba(28, 15, 7, 0.74);
    }

    .finish-panel {
      width: min(560px, 85vw);

      padding: 32px;

      border: 4px solid #b98a40;
      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          #f7eacb,
          #d7b370
        );

      color: #442718;

      text-align: center;

      box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.5);
    }

    .finish-panel h2 {
      margin-bottom: 10px;

      font-size: 34px;
    }

    .finish-panel p {
      margin-bottom: 20px;

      font-size: 17px;
      line-height: 1.5;
    }

    .back-life {
      display: inline-block;

      padding: 12px 29px;

      border: 2px solid #efd393;
      border-radius: 11px;

      background:
        linear-gradient(
          145deg,
          #be8936,
          #7b4a19
        );

      color: #fff;

      text-decoration: none;

      font-size: 17px;
      font-weight: bold;

      box-shadow:
        0 7px 15px rgba(0, 0, 0, 0.30);
    }

    .back-life:hover {
      transform: scale(1.05);
    }

    /* ==================================================
       MOBIL
       ================================================== */

    @media (max-width: 800px) {

      .player-character {
        height: 31vh;
      }

      .guide-message {
        left: 15%;
        bottom: 22%;

        max-width: 290px;

        font-size: 14px;
      }

      .top-panel {
        min-width: 0;
        width: 65%;
      }

      .scene-title {
        font-size: 19px;
      }

      .info-bubble {
        width: 42vw;
      }

      .task-options {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>

<body>

  <main class="game">

    <div
      class="scene-background"
      id="sceneBackground"
    ></div>

    <div class="scene-overlay"></div>

    <!-- ==================================================
         HORNÍ PANEL
         ================================================== -->

    <header class="top-panel">

      <div
        class="scene-number"
        id="sceneNumber"
      >
        ČÁST 1 / 2
      </div>

      <div
        class="scene-title"
        id="sceneTitle"
      >
        MĚŠŤANSKÝ DŮM
      </div>

    </header>

    <!-- ==================================================
         POSTUP
         ================================================== -->

    <div
      class="scene-progress"
      id="sceneProgress"
    >
      Prozkoumáno: 0 / 4
    </div>

    <!-- ==================================================
         HRÁČ
         ================================================== -->

    <img
      class="player-character"
      id="playerCharacter"
      src=""
      alt="Hráčova postava"
    >

    <!-- ==================================================
         BUBLINA
         ================================================== -->

    <div
      class="guide-message"
      id="guideMessage"
    >
      Vítej v měšťanském domě.
      Prozkoumej jeho vybavení a zjisti,
      jak se měšťanům v době baroka žilo.
    </div>

    <!-- ==================================================
         HOTSPOTY
         ================================================== -->

    <div
      class="hotspots"
      id="hotspots"
    ></div>

    <div
      class="info-bubble"
      id="infoBubble"
    ></div>

    <!-- ==================================================
         DÁLE
         ================================================== -->

    <button
      class="next-button"
      id="nextButton"
      hidden
    >
      DÁLE
    </button>

    <!-- ==================================================
         MINIÚKOL
         ================================================== -->

    <section
      class="city-task"
      id="cityTask"
      hidden
    >

      <h2>
        Kdo se stará o město?
      </h2>

      <p id="taskQuestion"></p>

      <div
        class="task-options"
        id="taskOptions"
      ></div>

      <div
        class="task-feedback"
        id="taskFeedback"
      ></div>

    </section>

    <!-- ==================================================
         KONEC
         ================================================== -->

    <section
      class="finish-screen"
      id="finishScreen"
      hidden
    >

      <div class="finish-panel">

        <h2>
          Život měšťanů prozkoumán
        </h2>

        <p>
          Poznal/a jsi měšťanský dům,
          hospodářství i život ve městě.
        </p>

        <a
          href="life.html"
          class="back-life"
        >
          ZPĚT NA ROZCESTÍ
        </a>

      </div>

    </section>

  </main>

  <script>

    /* ==================================================
       POSTAVA HRÁČE
       ================================================== */

    const playerCharacter =
      document.getElementById(
        "playerCharacter"
      );

    const storedCharacter =
      localStorage.getItem(
        "obleceniObrazek"
      );

    if (storedCharacter) {

      playerCharacter.src =
        storedCharacter;

    } else {

      playerCharacter.style.display =
        "none";

    }

    /* ==================================================
       2 ČÁSTI
       ================================================== */

    const scenes = [

      /* ==================================================
         1. MĚŠŤANSKÝ DŮM
         ================================================== */

      {
        title:
          "MĚŠŤANSKÝ DŮM A HOSPODÁŘSTVÍ",

        image:
          "images/mestane-dum.jpg",

        intro:
          "Měšťanský dům nebyl jen místem k bydlení. Často byl spojen také s prací a hospodářstvím.",

        hotspots: [

          {
            x: 31,
            y: 58,

            icon: "🔥",

            text:
              "Kamna nebo pec vytápěly dům a sloužily také při přípravě jídla."
          },

          {
            x: 48,
            y: 65,

            icon: "🪑",

            text:
              "Bohatší měšťané si mohli dovolit pohodlnější nábytek a lépe vybavené domácnosti."
          },

          {
            x: 66,
            y: 54,

            icon: "🗄️",

            text:
              "V domácnostech se postupně více používaly skříně k ukládání oděvů a dalších věcí."
          },

          {
            x: 75,
            y: 70,

            icon: "🧺",

            text:
              "Mnozí měšťané měli i vlastní hospodářství a za hradbami města obdělávali půdu."
          }

        ]
      },

      /* ==================================================
         2. MĚSTO
         ================================================== */

      {
        title:
          "ŽIVOT VE MĚSTĚ",

        image:
          "images/mestane-mesto.jpg",

        intro:
          "Města se po třicetileté válce obnovovala pomalu. Prozkoumej, kdo se staral o jejich chod.",

        hotspots: [

          {
            x: 46,
            y: 39,

            icon: "🏛️",

            text:
              "Město spravovala městská rada spolu s rychtářem."
          },

          {
            x: 70,
            y: 61,

            icon: "🏮",

            text:
              "Ponocný v noci procházel městem a dohlížel na pořádek."
          },

          {
            x: 31,
            y: 59,

            icon: "🛡️",

            text:
              "O bezpečnost města se starala také městská stráž."
          },

          {
            x: 79,
            y: 45,

            icon: "🔒",

            text:
              "Šatlava byla městská věznice, kam byli zavíráni provinilci."
          }

        ]
      }

    ];

    /* ==================================================
       PRVKY
       ================================================== */

    const sceneBackground =
      document.getElementById(
        "sceneBackground"
      );

    const sceneTitle =
      document.getElementById(
        "sceneTitle"
      );

    const sceneNumber =
      document.getElementById(
        "sceneNumber"
      );

    const sceneProgress =
      document.getElementById(
        "sceneProgress"
      );

    const guideMessage =
      document.getElementById(
        "guideMessage"
      );

    const hotspotsElement =
      document.getElementById(
        "hotspots"
      );

    const infoBubble =
      document.getElementById(
        "infoBubble"
      );

    const nextButton =
      document.getElementById(
        "nextButton"
      );

    const cityTask =
      document.getElementById(
        "cityTask"
      );

    const finishScreen =
      document.getElementById(
        "finishScreen"
      );

    let currentScene =
      0;

    let visited =
      new Set();

    /* ==================================================
       NAČTENÍ SCÉNY
       ================================================== */

    function loadScene() {

      const scene =
        scenes[currentScene];

      visited =
        new Set();

      sceneBackground.style.backgroundImage =
        `url("${scene.image}")`;

      sceneTitle.textContent =
        scene.title;

      sceneNumber.textContent =
        "ČÁST "
        + (currentScene + 1)
        + " / 2";

      sceneProgress.textContent =
        "Prozkoumáno: 0 / "
        + scene.hotspots.length;

      guideMessage.textContent =
        scene.intro;

      infoBubble.classList.remove(
        "visible"
      );

      nextButton.hidden =
        true;

      hotspotsElement.innerHTML =
        "";

      scene.hotspots.forEach(
        function (hotspot, index) {

          const button =
            document.createElement(
              "button"
            );

          button.className =
            "hotspot";

          button.type =
            "button";

          button.textContent =
            hotspot.icon;

          button.style.left =
            hotspot.x + "%";

          button.style.top =
            hotspot.y + "%";

          button.style.transform =
            "translate(-50%, -50%)";

          button.addEventListener(
            "click",
            function () {

              showInfo(
                button,
                hotspot,
                index
              );

            }
          );

          hotspotsElement.appendChild(
            button
          );

        }
      );

    }

    /* ==================================================
       HOTSPOT
       ================================================== */

    function showInfo(
      button,
      hotspot,
      index
    ) {

      visited.add(
        index
      );

      button.classList.add(
        "visited"
      );

      infoBubble.textContent =
        hotspot.text;

      let x =
        hotspot.x + 4;

      let y =
        hotspot.y - 13;

      if (x > 67) {

        x =
          hotspot.x - 28;

      }

      if (y < 15) {

        y =
          hotspot.y + 7;

      }

      infoBubble.style.left =
        x + "%";

      infoBubble.style.top =
        y + "%";

      infoBubble.classList.add(
        "visible"
      );

      const scene =
        scenes[currentScene];

      sceneProgress.textContent =
        "Prozkoumáno: "
        + visited.size
        + " / "
        + scene.hotspots.length;

      if (
        visited.size ===
        scene.hotspots.length
      ) {

        guideMessage.textContent =
          "Výborně! Tuto část už znáš.";

        nextButton.hidden =
          false;

      }

    }

    /* ==================================================
       DÁLE
       ================================================== */

    nextButton.addEventListener(
      "click",
      function () {

        if (
          currentScene === 0
        ) {

          currentScene =
            1;

          loadScene();

        } else {

          startCityTask();

        }

      }
    );

    /* ==================================================
       MINIÚKOL
       ================================================== */

    const taskQuestion =
      document.getElementById(
        "taskQuestion"
      );

    const taskOptions =
      document.getElementById(
        "taskOptions"
      );

    const taskFeedback =
      document.getElementById(
        "taskFeedback"
      );

    const cityQuestions = [

      {
        question:
          "Kdo spolu s městskou radou spravoval město?",

        options: [
          "Rychtář",
          "Ponocný",
          "Sedlák",
          "Kočí"
        ],

        answer:
          "Rychtář"
      },

      {
        question:
          "Kdo v noci obcházel město a dohlížel na pořádek?",

        options: [
          "Ponocný",
          "Rychtář",
          "Obchodník",
          "Sedlák"
        ],

        answer:
          "Ponocný"
      },

      {
        question:
          "Jak se nazývala městská věznice?",

        options: [
          "Šatlava",
          "Radnice",
          "Manufaktura",
          "Stáj"
        ],

        answer:
          "Šatlava"
      }

    ];

    let currentQuestion =
      0;

    function startCityTask() {

      hotspotsElement.innerHTML =
        "";

      infoBubble.classList.remove(
        "visible"
      );

      guideMessage.style.display =
        "none";

      nextButton.hidden =
        true;

      cityTask.hidden =
        false;

      showQuestion();

    }

    function showQuestion() {

      if (
        currentQuestion >=
        cityQuestions.length
      ) {

        finishMestane();

        return;

      }

      const question =
        cityQuestions[currentQuestion];

      taskQuestion.textContent =
        question.question;

      taskOptions.innerHTML =
        "";

      taskFeedback.textContent =
        "";

      question.options.forEach(
        function (option) {

          const button =
            document.createElement(
              "button"
            );

          button.className =
            "task-option";

          button.type =
            "button";

          button.textContent =
            option;

          button.addEventListener(
            "click",
            function () {

              if (
                option ===
                question.answer
              ) {

                button.classList.add(
                  "correct"
                );

                taskFeedback.style.color =
                  "#52712d";

                taskFeedback.textContent =
                  "✓ Správně!";

                const buttons =
                  taskOptions.querySelectorAll(
                    "button"
                  );

                buttons.forEach(
                  function (btn) {

                    btn.disabled =
                      true;

                  }
                );

                setTimeout(
                  function () {

                    currentQuestion++;

                    showQuestion();

                  },
                  800
                );

              } else {

                button.classList.add(
                  "wrong"
                );

                taskFeedback.style.color =
                  "#9b392d";

                taskFeedback.textContent =
                  "✕ Zkus to ještě jednou.";

              }

            }
          );

          taskOptions.appendChild(
            button
          );

        }
      );

    }

    /* ==================================================
       DOKONČENÍ
       ================================================== */

    function finishMestane() {

      localStorage.setItem(
        "life_mestane",
        "completed"
      );

      cityTask.hidden =
        true;

      finishScreen.hidden =
        false;

    }

    /* ==================================================
       START
       ================================================== */

    loadScene();

  </script>

</body>

</html>
