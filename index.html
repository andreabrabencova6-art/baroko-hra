<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Baroko – Vyber si postavu</title>

  <style>

    /* ==================================================
       ZÁKLAD
       ================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      background: #29190e;
    }

    button {
      font-family:
        Georgia,
        "Times New Roman",
        serif;
    }


    /* ==================================================
       HLAVNÍ OBRAZOVKA
       ================================================== */

    .character-screen {
      position: relative;

      width: 100%;
      height: 100svh;

      overflow: hidden;

      background-image:
        linear-gradient(
          rgba(27, 17, 8, 0.18),
          rgba(27, 17, 8, 0.38)
        ),
        url("images/vyber-postavy-pozadi.png");

      background-size: cover;

      background-position:
        center;

      background-repeat:
        no-repeat;
    }


    /* lehké ztmavení okrajů */

    .character-screen::after {
      content: "";

      position: absolute;

      inset: 0;

      z-index: 1;

      pointer-events: none;

      background:
        radial-gradient(
          circle at center,
          transparent 35%,
          rgba(20, 10, 4, 0.38) 100%
        );
    }


    /* ==================================================
       NADPIS
       ================================================== */

    .intro {
      position: absolute;

      top: 4%;
      left: 50%;

      transform:
        translateX(-50%);

      z-index: 20;

      width: 75%;

      text-align: center;

      color: #fff0c7;

      text-shadow:
        0 4px 10px
        rgba(0, 0, 0, 0.9);
    }

    .intro h1 {
      margin:
        0
        0
        8px;

      font-size:
        clamp(
          30px,
          4vw,
          52px
        );

      letter-spacing:
        4px;
    }

    .intro p {
      margin: 0;

      font-size:
        clamp(
          15px,
          1.7vw,
          21px
        );

      line-height:
        1.4;
    }


    /* ==================================================
       POSTAVY
       ================================================== */

    .characters {
      position: absolute;

      left: 50%;
      bottom: 2%;

      transform:
        translateX(-50%);

      z-index: 10;

      width: 72%;
      height: 77%;

      display: flex;

      justify-content:
        center;

      align-items:
        flex-end;

      gap:
        clamp(
          70px,
          11vw,
          170px
        );
    }


    /* ==================================================
       JEDNA POSTAVA
       ================================================== */

    .character {
      position: relative;

      width: 32%;
      height: 100%;

      border: none;

      background:
        transparent;

      padding: 0;

      cursor: pointer;

      touch-action:
        manipulation;

      display: flex;

      flex-direction:
        column;

      justify-content:
        flex-end;

      align-items:
        center;

      -webkit-tap-highlight-color:
        transparent;
    }


    .character-image-wrap {
      position: relative;

      width: 100%;
      height: 83%;

      display: flex;

      align-items:
        flex-end;

      justify-content:
        center;

      transition:
        transform
        0.28s ease;
    }


    .character img {
      max-width: 100%;
      max-height: 100%;

      object-fit: contain;

      pointer-events:
        none;

      user-select:
        none;

      -webkit-user-drag:
        none;

      filter:
        drop-shadow(
          0 15px 13px
          rgba(0, 0, 0, 0.58)
        );

      transition:
        filter 0.3s ease;
    }


    /* světlo za postavou */

    .character-image-wrap::before {
      content: "";

      position: absolute;

      left: 50%;
      bottom: 5%;

      transform:
        translateX(-50%);

      width: 90%;
      height: 70%;

      z-index: -1;

      border-radius: 50%;

      opacity: 0;

      background:
        radial-gradient(
          ellipse,
          rgba(255, 220, 130, 0.42),
          rgba(255, 220, 130, 0) 68%
        );

      transition:
        opacity
        0.3s ease;
    }


    .character:hover
    .character-image-wrap,

    .character:focus
    .character-image-wrap {

      transform:
        translateY(-8px)
        scale(1.025);
    }


    .character:hover
    .character-image-wrap::before,

    .character:focus
    .character-image-wrap::before {

      opacity: 1;
    }


    .character:active
    .character-image-wrap {

      transform:
        scale(0.97);
    }


    /* ==================================================
       POPISEK POSTAVY
       ================================================== */

    .character-label {
      position: relative;

      min-width: 210px;

      margin-top: -5px;

      padding:
        11px
        28px;

      border:
        2px solid
        #e1bd72;

      border-radius:
        14px;

      background:
        linear-gradient(
          145deg,
          rgba(104, 66, 29, 0.96),
          rgba(60, 35, 15, 0.97)
        );

      color:
        #fff0c8;

      font-size:
        clamp(
          15px,
          1.7vw,
          20px
        );

      font-weight:
        bold;

      letter-spacing:
        1px;

      text-align:
        center;

      box-shadow:
        0 8px 18px
        rgba(0, 0, 0, 0.38);
    }


    .character-subtitle {
      display: block;

      margin-top: 3px;

      color:
        #d9c08c;

      font-size:
        12px;

      font-weight:
        normal;

      letter-spacing:
        0;
    }


    /* ==================================================
       MALÝ SPODNÍ TEXT
       ================================================== */

    .hint {
      position: absolute;

      left: 50%;
      bottom: 1.5%;

      transform:
        translateX(-50%);

      z-index: 20;

      padding:
        5px
        14px;

      border-radius:
        12px;

      background:
        rgba(35, 20, 8, 0.68);

      color:
        #ead7aa;

      font-size:
        12px;

      pointer-events:
        none;
    }


    /* ==================================================
       ANIMACE ODCHODU
       ================================================== */

    .character-screen.leaving
    .intro,

    .character-screen.leaving
    .character:not(.selected) {

      opacity: 0;

      transition:
        opacity
        0.45s ease;
    }


    .character-screen.leaving
    .character.selected {

      animation:
        selectedCharacter
        0.7s ease
        forwards;
    }


    @keyframes selectedCharacter {

      0% {
        transform:
          scale(1);

        opacity: 1;
      }

      55% {
        transform:
          scale(1.08);

        opacity: 1;
      }

      100% {
        transform:
          scale(1.15);

        opacity: 0;
      }

    }


    /* ==================================================
       TABLET NALEŽATO
       ================================================== */

    @media
      (orientation: landscape)
      and
      (max-height: 850px) {

      .intro {
        top: 2.5%;
      }

      .intro h1 {
        margin-bottom: 4px;
      }

      .characters {
        height: 79%;
      }

      .character-image-wrap {
        height: 84%;
      }

      .character-label {
        padding:
          8px
          23px;
      }

    }


    /* ==================================================
       TABLET NA VÝŠKU
       ================================================== */

    .rotate-warning {
      display: none;
    }


    @media
      (orientation: portrait) {

      .rotate-warning {
        position: fixed;

        inset: 0;

        z-index: 99999;

        display: flex;

        flex-direction:
          column;

        align-items:
          center;

        justify-content:
          center;

        padding:
          40px;

        background:
          linear-gradient(
            145deg,
            #2a170c,
            #55351d
          );

        color:
          #f5e2b3;

        text-align:
          center;
      }

      .rotate-symbol {
        font-size:
          75px;
      }

      .rotate-warning h2 {
        margin:
          15px
          0
          7px;

        font-size:
          30px;
      }

      .rotate-warning p {
        margin: 0;

        max-width:
          450px;

        font-size:
          18px;

        line-height:
          1.45;
      }

    }

  </style>

</head>


<body>


  <!-- ==================================================
       OTOČ TABLET
       ================================================== -->

  <div class="rotate-warning">

    <div class="rotate-symbol">
      ↻
    </div>

    <h2>
      Otoč tablet na šířku
    </h2>

    <p>
      Tato hra je připravena
      pro hraní na tabletu naležato.
    </p>

  </div>



  <!-- ==================================================
       VÝBĚR POSTAVY
       ================================================== -->

  <main
    class="character-screen"
    id="characterScreen"
  >


    <!-- NADPIS -->

    <header class="intro">

      <h1>
        CESTA DO BAROKA
      </h1>

      <p>
        Vyber si postavu,
        se kterou se vydáš
        do světa 17. a 18. století.
      </p>

    </header>



    <!-- POSTAVY -->

    <section class="characters">


      <!-- ==================================================
           MUŽ
           ================================================== -->

      <button
        class="character"
        id="maleCharacter"
        data-gender="muz"
        aria-label="Vybrat muže"
      >

        <div class="character-image-wrap">

          <img
            src="images/chudy-muz.png"
            alt="Chudý muž z období baroka"
          >

        </div>


        <div class="character-label">

          VYBRAT MUŽE

          <span class="character-subtitle">
            začínáš jako venkovan
          </span>

        </div>

      </button>



      <!-- ==================================================
           ŽENA
           ================================================== -->

      <button
        class="character"
        id="femaleCharacter"
        data-gender="zena"
        aria-label="Vybrat ženu"
      >

        <div class="character-image-wrap">

          <img
            src="images/chuda-zena.png"
            alt="Chudá žena z období baroka"
          >

        </div>


        <div class="character-label">

          VYBRAT ŽENU

          <span class="character-subtitle">
            začínáš jako venkovanka
          </span>

        </div>

      </button>


    </section>


    <div class="hint">
      Klepni na jednu z postav
    </div>


  </main>



  <script>

    /* ==================================================
       VÝBĚR POSTAVY
       ================================================== */

    const characterScreen =
      document.getElementById(
        "characterScreen"
      );


    const characters =
      document.querySelectorAll(
        ".character"
      );


    let selectionLocked =
      false;



    characters.forEach(
      function (character) {

        character.addEventListener(
          "click",
          function () {

            if (selectionLocked) {

              return;

            }


            selectionLocked =
              true;


            const gender =
              character.dataset.gender;



            /* ===========================================
               ULOŽENÍ POHLAVÍ
               =========================================== */

            localStorage.setItem(
              "pohlavi",
              gender
            );



            /*
              Vymažeme případný starý
              výběr oblečení z předchozí hry.
            */

            localStorage.removeItem(
              "obleceni"
            );


            localStorage.removeItem(
              "obleceniObrazek"
            );



            /* ===========================================
               ULOŽENÍ ZÁKLADNÍ POSTAVY
               =========================================== */

            if (
              gender === "zena"
            ) {

              localStorage.setItem(
                "zakladniPostava",
                "images/chuda-zena.png"
              );

            }

            else {

              localStorage.setItem(
                "zakladniPostava",
                "images/chudy-muz.png"
              );

            }



            /* ===========================================
               KRÁTKÁ ANIMACE
               =========================================== */

            character.classList.add(
              "selected"
            );


            characterScreen
              .classList
              .add(
                "leaving"
              );



            /* ===========================================
               PŘECHOD NA VENKOV
               =========================================== */

            setTimeout(
              function () {

                window.location.href =
                  "venkov.html";

              },
              650
            );

          }
        );

      }
    );

  </script>

</body>

</html>
