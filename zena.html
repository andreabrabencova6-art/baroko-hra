<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Baroko – výběr oblečení</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="character-screen">

    <div class="character-content">

      <h1>BAROKO</h1>

      <h2>Vyber si své oblečení</h2>

      <p>
        Vyber si barokní oděv, který bude tvoje postava nosit
        po zbytek hry.
      </p>


      <div class="character-options outfit-options">

        <!-- OBLEČENÍ 1 -->

        <a
          href="hra.html"
          class="character-card outfit-card"
          data-outfit="zena1"
          data-image="images/zena1.png"
        >

          <img
            src="images/zena1.png"
            alt="První ženský barokní oděv"
          >

          <h3>Oděv 1</h3>

        </a>


        <!-- OBLEČENÍ 2 -->

        <a
          href="hra.html"
          class="character-card outfit-card"
          data-outfit="zena2"
          data-image="images/zena2.png"
        >

          <img
            src="images/zena2.png"
            alt="Druhý ženský barokní oděv"
          >

          <h3>Oděv 2</h3>

        </a>


        <!-- OBLEČENÍ 3 -->

        <a
          href="hra.html"
          class="character-card outfit-card"
          data-outfit="zena3"
          data-image="images/zena3.png"
        >

          <img
            src="images/zena3.png"
            alt="Třetí ženský barokní oděv"
          >

          <h3>Oděv 3</h3>

        </a>

      </div>

    </div>

  </main>


  <script src="script.js"></script>

</body>

</html>
